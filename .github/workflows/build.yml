name: Build Plugin Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract Zip
      run: unzip -o FeatureSuite.zip

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package --file FeatureSuite/pom.xml

    - name: Upload Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FeatureSuite-jar
        path: FeatureSuite/target/*.jar
