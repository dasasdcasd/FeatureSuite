name: Build Plugin Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Force Extract Everything
      run: |
        unzip -o FeatureSuite.zip || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Smart Compile
      run: |
        # Automatically locate the folder that actually contains the Java source code
        cd $(dirname $(find . -name "src" -type d | head -n 1))
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FeatureSuite-jar
        path: "**/target/*.jar"
